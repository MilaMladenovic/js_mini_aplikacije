<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konvertor temperature</title>

    <link rel="stylesheet" href="css/konvertor.css" />
  </head>
  <body>
    <div id="konvertor">
      <h1>Konvertor temperature</h1>
      
      <input type="number" name="tempPolje" id="tempPolje" placeholder="Unesite temperaturu">
      <input type="text" name="rezultatPolje" id="rezultatPolje" placeholder="Rezultat" disabled>

      <button id="uFarenhajt">°C u °F</button>
      <button id="uCelzijus">°F u °C</button>
    </div>

    <script src="js/konvertor.js"></script>
  </body>
</html>
